# Local development: only infrastructure. Apps run with `pnpm dev`.
name: vapehard-dev

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: vape
      POSTGRES_PASSWORD: vape
      POSTGRES_DB: vape
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pg-dev:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vape']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes:
      - minio-dev:/data

  # One-shot jobs (the image has no shell): create the bucket, then allow public read of products/*.
  minio-bucket:
    image: cgr.dev/chainguard/minio-client@sha256:d1b0ec88e3ac5233e2862594c06399095337fa816c0960f78081ba4965bdc0c5
    depends_on: [minio]
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: ['mb', '--ignore-existing', 'local/vapehard']
    restart: on-failure

  minio-policy:
    image: cgr.dev/chainguard/minio-client@sha256:d1b0ec88e3ac5233e2862594c06399095337fa816c0960f78081ba4965bdc0c5
    depends_on:
      minio-bucket:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: ['anonymous', 'set', 'download', 'local/vapehard/products']
    restart: on-failure

volumes:
  pg-dev:
  minio-dev:
